spring:
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/medvault
    username: medvault_user
    password: medvault_password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

---
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

jwt:
  # No default: the application fails fast at startup when JWT_SECRET is missing.
  # Set JWT_SECRET (>=32 chars) in your environment / .env. Never commit the real value.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:1800000} # 30 minutes in ms

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  level:
    com.medvault: INFO
    org.springframework.web: WARN
    org.hibernate: WARN

spring:
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

rate-limiting:
  login:
    max-requests-per-minute: 5
  # Only set true when behind a trusted proxy that sanitizes X-Forwarded-For.
  trust-forwarded-headers: ${RATE_LIMIT_TRUST_PROXY:false}
